version: '3.8'

services:
  # PostgreSQL with PostGIS for geospatial queries
  postgres:
    image: postgis/postgis:16-3.4
    container_name: khabar-postgres
    environment:
      POSTGRES_USER: khabar
      POSTGRES_PASSWORD: khabar_secret
      POSTGRES_DB: khabar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khabar -d khabar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - khabar-network

  # Redis for caching, sessions, and real-time pub/sub
  redis:
    image: redis:7-alpine
    container_name: khabar-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - khabar-network

  # MinIO for S3-compatible object storage (videos/images)
  minio:
    image: minio/minio:latest
    container_name: khabar-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - khabar-network

  # MinIO bucket creation helper
  minio-init:
    image: minio/mc:latest
    container_name: khabar-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/khabar-media --ignore-existing;
      mc mb myminio/khabar-thumbnails --ignore-existing;
      mc anonymous set download myminio/khabar-media;
      mc anonymous set download myminio/khabar-thumbnails;
      exit 0;
      "
    networks:
      - khabar-network

  # BullMQ Dashboard (optional - for job monitoring)
  bullboard:
    image: deadly0/bull-board
    container_name: khabar-bullboard
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BULL_PREFIX: bull
    ports:
      - "3030:3000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - khabar-network

  # Application (for production-like testing)
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: khabar-app
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://khabar:khabar_secret@postgres:5432/khabar?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_NAME: khabar-media
      S3_REGION: us-east-1
      S3_PUBLIC_URL: http://localhost:9000/khabar-media
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - khabar-network
    profiles:
      - full

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  khabar-network:
    driver: bridge
